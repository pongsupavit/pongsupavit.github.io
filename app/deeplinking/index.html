<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deeplink Testing Tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared/sidebar.css" />
    <script src="../shared/sidebar.js" defer></script>
    <style>
      :root {
        --bg: #f6f5f4;
        --panel: #ffffff;
        --text: #1f1f1f;
        --muted: #6b6b6b;
        --line: #e6e5e3;
        --primary: #1f1f1f;
        --primary-dark: #111111;
        --chip: #f2f1f0;
        --shadow: 0 16px 32px rgba(15, 15, 15, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "IBM Plex Sans", sans-serif;
        color: var(--text);
        background: var(--bg);
      }

      .shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 60px 20px 80px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 32px;
        max-width: 720px;
        width: 100%;
        box-shadow: var(--shadow);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.6;
      }

      label {
        font-weight: 600;
        display: block;
        margin: 18px 0 8px;
      }

      .input-row {
        display: grid;
        gap: 12px;
      }

      input[type="url"],
      input[type="text"] {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--line);
        font-size: 15px;
        background: #fff;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      button,
      .ghost-link {
        border: none;
        border-radius: 10px;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      button.primary {
        background: var(--primary);
        color: #fff;
      }

      button.primary:hover {
        background: var(--primary-dark);
      }

      button.secondary {
        background: var(--chip);
        color: var(--text);
      }

      .ghost-link {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--line);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .helper {
        font-size: 13px;
        color: var(--muted);
        margin-top: 8px;
      }

      .chip-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 18px;
      }

      .chip {
        font-size: 12px;
        background: var(--chip);
        padding: 4px 10px;
        border-radius: 999px;
      }

      .launch {
        display: none;
        text-align: center;
        gap: 18px;
      }

      .launch h2 {
        margin: 0;
        font-size: 18px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .launch-link {
        display: inline-block;
        background: #111111;
        color: #ffffff;
        padding: 14px 20px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 700;
        letter-spacing: 0.4px;
        word-break: break-all;
      }

      .launch-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 18px;
      }

      .launch-actions button {
        background: var(--chip);
        color: var(--text);
        border-radius: 10px;
      }

      .launch-actions button:hover {
        background: #e7e6e4;
      }

      .panel {
        display: none;
      }

      .panel.active,
      .launch.active {
        display: block;
      }

      @media (max-width: 720px) {
        .card {
          padding: 24px;
        }
      }

      @media (max-width: 980px) {
        .shell {
          padding: 40px 16px 60px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-layout">
      <div id="app-sidebar"></div>
      <main class="app-main">
        <div class="shell">
          <div class="card">
          <section class="panel" id="input-panel">
            <h1>Test a Mobile Deeplink</h1>
            <p>
              Enter a deep link or universal link. We will generate a shareable URL so you
              can tap to launch on mobile.
            </p>

            <label for="deeplink">Deeplink URL</label>
            <div class="input-row">
              <input
                id="deeplink"
                type="url"
                placeholder="myapp://product/123 or https://example.com/app"
                autocomplete="off"
              />
            </div>
            <div class="helper">Supports custom schemes, iOS Universal Links, and Android App Links.</div>

            <div class="actions">
              <button class="primary" type="button" id="create-link">Create test link</button>
              <a class="ghost-link" href="../index.html">Back to App Hub</a>
            </div>
          </section>

          <section class="launch" id="launch-panel">
            <h2>Tap to Launch</h2>
            <a class="launch-link" id="launch-link" href="#">DEEPLINK</a>
            <div class="launch-actions">
              <button type="button" id="edit-link">Edit</button>
              <button type="button" id="reset-link">Reset</button>
            </div>
          </section>

          <div class="chip-row">
            <span class="chip">iOS Universal Links</span>
            <span class="chip">Android App Links</span>
            <span class="chip">Custom Scheme</span>
          </div>
          </div>
        </div>
      </main>
    </div>

    <script>
      const inputPanel = document.getElementById("input-panel");
      const launchPanel = document.getElementById("launch-panel");
      const deeplinkInput = document.getElementById("deeplink");
      const launchLink = document.getElementById("launch-link");

      const showInput = (value = "") => {
        deeplinkInput.value = value;
        inputPanel.classList.add("active");
        launchPanel.classList.remove("active");
      };

      const showLaunch = (link) => {
        launchLink.textContent = link;
        launchLink.href = link;
        inputPanel.classList.remove("active");
        launchPanel.classList.add("active");
      };

      const getParamLink = () => {
        const params = new URLSearchParams(window.location.search);
        return params.get("link") || "";
      };

      const updateUrl = (link) => {
        const params = new URLSearchParams();
        params.set("link", link);
        const nextUrl = `${window.location.pathname}?${params.toString()}`;
        window.history.pushState({}, "", nextUrl);
      };

      const initialLink = getParamLink();
      if (initialLink) {
        showLaunch(initialLink);
      } else {
        showInput();
      }

      document.getElementById("create-link").addEventListener("click", () => {
        const link = deeplinkInput.value.trim();
        if (!link) {
          deeplinkInput.focus();
          return;
        }
        updateUrl(link);
        showLaunch(link);
      });

      document.getElementById("edit-link").addEventListener("click", () => {
        const link = getParamLink();
        showInput(link);
      });

      document.getElementById("reset-link").addEventListener("click", () => {
        window.history.pushState({}, "", window.location.pathname);
        showInput();
      });
    </script>
  </body>
</html>
